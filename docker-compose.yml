version: "3.8"

services:

  # -------------------- CONFIG SERVER --------------------
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - bus-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------- ZOOKEEPER --------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - bus-network

  # -------------------- KAFKA --------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bus-network

  # -------------------- MYSQL --------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bus_booking
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - bus-network


  # -------------------- EUREKA SERVER --------------------
  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8671:8761"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - bus-network


  # -------------------- BOOKING SERVICE --------------------
  booking-service:
    build: ./booking-service
    container_name: booking-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: dev

    networks:
      - bus-network


  # -------------------- BUS SERVICE --------------------
  bus-service:
    build: ./bus-service
    container_name: bus-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

    ports:
      - "8082:8082"

    environment:
      SPRING_PROFILES_ACTIVE: dev

    networks:
      - bus-network


  # -------------------- PAYMENT SERVICE --------------------
  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

    ports:
      - "8083:8083"

    environment:
      SPRING_PROFILES_ACTIVE: dev

    networks:
      - bus-network


  # -------------------- SEAT SERVICE --------------------
  seat-service:
    build: ./seat-service
    container_name: seat-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

    ports:
      - "8084:8084"

    environment:
      SPRING_PROFILES_ACTIVE: dev

    networks:
      - bus-network


  # -------------------- API GATEWAY --------------------
  bus-api-gateway:
    build: ./bus-api-gateway
    container_name: bus-api-gateway
    depends_on:
      service-registry:
        condition: service_started
      config-server:
        condition: service_started

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: dev

    networks:
      - bus-network


# -------------------- NETWORK --------------------
networks:
  bus-network:
    driver: bridge


# -------------------- VOLUMES --------------------
volumes:
  mysql_data:
